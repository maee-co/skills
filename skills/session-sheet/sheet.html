<title>セッション票</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!--
セッション票の雛形。1 セッション 1 枚。器は固定で、中身は全部 db から描く。
使い方: <title> だけ書き換えて下の capabilities で公開 → ArtifactData で下の db に書く。ページの再公開は要らない。
  capabilities: {"db":{"rules":[{"path":"asks","read":"view","write":"interact"},{"path":"meta","read":"view","write":"owner"},
    {"path":"steps","read":"view","write":"owner"},{"path":"evidence","read":"view","write":"owner"},{"path":"blocks","read":"view","write":"owner"},{"path":"log","read":"view","write":"owner"}]}}
  依頼者が答える asks だけ interact が書ける。それ以外は持ち主だけ。db は票を開ける人全員が読める → シークレット・個人情報は書かない。
  書き込みは読んだ version を if_version に付ける。食い違ったら読み直す（依頼者がページで答えている）。3 件以上は batch。
  ① meta/session   {title, state: running|waiting|done|stopped, ask, done, summary, updatedAt, hub?}
  ② asks/<id>      {order, q, why?, options:[{id,label,desc?}] (先頭=推奨), default?, answer?, memo?}  ← 依頼者 がページ上で答える
  ③ steps/<id>     {order, title, status: todo|doing|done, note?}   アプリのタスクリストと同じ粒度
  ④ evidence/<id>  {order, kind: PR|Issue|調査|検証|成果物, title, detail?, link?, linkLabel?}
  ⑤ blocks/<id>    {order, type, title?, ...}  可変枠。図が先、文章は添えるだけ
       flow    {steps:[{label, note?, state?: done|doing|todo|warn}]}       流れ・手順・仕組み
       stats   {items:[{label, value, unit?, note?, tone?}]}                数字は 4 つまで
       compare {items:[{name, badge?, tone?, points:[..]}]}                 案の比較（推奨は先頭・badge）
       meter   {unit?, total, parts:[{label, value, tone?}]}               内訳・容量
       plot    {mark: barY|barX|lineY|dot, data:[{..}], x, y, color?, note?} Observable Plot（必要なときだけ読み込む）
       table   {columns:[..], rows:[[..]]}
       callout {tone?, text}                                                1 行の注意・結論
       text    {body}                                                       3 行まで。長くなるなら図にする
  ⑥ log/<id>       {at, text}
  tone: info | warn | ok | danger | muted
文字数の目安: summary 60 字・step/evidence の title 30 字・note 1 行・text 3 行。超えるなら図か表にする。
色は shadcn/ui の変数名 + Radix Colors（sage / teal / amber / grass / red, v3.0.0）。
-->
<style>
/* layout: 1 カラムの票。①頭 ②してほしいこと ③進捗の流れ ④成果と証拠 ⑤可変（図） ⑥経緯。スマホで上から 2 枠読めば足りる */
:root{
  --background:#f7f9f8; --card:#fbfdfc; --foreground:#1a211e; --muted:#eef1f0; --muted-foreground:#5f6563;
  --border:#d7dad9; --input:#cbcfcd; --ring:#53b9ab;
  --primary:#008573; --primary-soft:#e0f8f3; --primary-line:#83cdc1; --primary-foreground:#fbfdfc;
  --warn:#ab6400; --warn-soft:#fefbe9; --warn-line:#e9c162;
  --ok:#2a7e3b; --ok-soft:#e9f6e9; --ok-line:#94ce9a;
  --danger:#ce2c31; --danger-soft:#feebec; --danger-line:#f4a9aa;
  --chart-1:#12a594; --chart-2:#ffc53d; --chart-3:#868e8b; --chart-4:#e5484d;
  --radius:10px;
  --sans:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --background:#101211; --card:#171918; --foreground:#eceeed; --muted:#202221; --muted-foreground:#adb5b2;
  --border:#373b39; --input:#444947; --ring:#207e73;
  --primary:#0bd8b6; --primary-soft:#0d2d2a; --primary-line:#1c6961; --primary-foreground:#101211;
  --warn:#ffca16; --warn-soft:#302008; --warn-line:#714f19;
  --ok:#71d083; --ok-soft:#1b2a1e; --ok-line:#366740;
  --danger:#ff9592; --danger-soft:#3b1219; --danger-line:#8c333a;
  --chart-1:#12a594; --chart-2:#ffc53d; --chart-3:#717d79; --chart-4:#ec5d5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --background:#101211; --card:#171918; --foreground:#eceeed; --muted:#202221; --muted-foreground:#adb5b2;
  --border:#373b39; --input:#444947; --ring:#207e73;
  --primary:#0bd8b6; --primary-soft:#0d2d2a; --primary-line:#1c6961; --primary-foreground:#101211;
  --warn:#ffca16; --warn-soft:#302008; --warn-line:#714f19;
  --ok:#71d083; --ok-soft:#1b2a1e; --ok-line:#366740;
  --danger:#ff9592; --danger-soft:#3b1219; --danger-line:#8c333a;
  --chart-1:#12a594; --chart-2:#ffc53d; --chart-3:#717d79; --chart-4:#ec5d5e; color-scheme:dark}
body{background:var(--background);color:var(--foreground);font-family:var(--sans);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
main{max-width:880px;margin:0 auto;display:grid;gap:32px}
h1{font-size:1.5rem;line-height:1.35;margin:0;text-wrap:balance}
h2{font-size:.78rem;letter-spacing:.08em;color:var(--muted-foreground);font-weight:600;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
h2 .count{font-family:var(--mono);font-weight:400}
h3{font-size:.95rem;margin:0 0 8px}
p{margin:0}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted-foreground)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.empty{padding:12px 14px;border:1px dashed var(--border);border-radius:var(--radius);color:var(--muted-foreground);font-size:.9rem}
/* tone */
.t-info{--tc:var(--primary);--ts:var(--primary-soft);--tl:var(--primary-line)}
.t-warn{--tc:var(--warn);--ts:var(--warn-soft);--tl:var(--warn-line)}
.t-ok{--tc:var(--ok);--ts:var(--ok-soft);--tl:var(--ok-line)}
.t-danger{--tc:var(--danger);--ts:var(--danger-soft);--tl:var(--danger-line)}
.t-muted{--tc:var(--muted-foreground);--ts:var(--muted);--tl:var(--border)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:99px;color:var(--tc);background:var(--ts);border:1px solid var(--tl);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

/* ① 頭 */
.head{display:grid;gap:10px}
.toprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8rem}
.summary{font-size:1.02rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.brief div{background:var(--card);padding:10px 14px;min-width:0}
.brief dt{font-size:.7rem;letter-spacing:.08em;color:var(--muted-foreground)}
.brief dd{margin:2px 0 0;font-size:.92rem;overflow-wrap:anywhere}

/* ② してほしいこと */
.asks{display:grid;gap:12px}
.ask{padding:14px 16px;display:grid;gap:10px;border-left:4px solid var(--warn-line)}
.ask.done{border-left-color:var(--ok-line)}
.ask .q{font-weight:700}
.ask .why{font-size:.86rem;color:var(--muted-foreground)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{display:grid;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--input);border-radius:8px;background:var(--background);color:var(--foreground);font:inherit;cursor:pointer}
.opt:hover{border-color:var(--ring)}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
.opt b{font-size:.92rem}
.opt small{color:var(--muted-foreground);font-size:.82rem}
.rec{font-size:.68rem;font-weight:700;color:var(--primary);letter-spacing:.06em}
.memo{width:100%;box-sizing:border-box;font:inherit;font-size:.88rem;padding:8px 10px;border:1px solid var(--input);border-radius:8px;background:var(--background);color:var(--foreground)}
.saved{font-size:.76rem;color:var(--muted-foreground)}

/* ③ 進捗 = 流れ図 */
.flow{display:flex;flex-wrap:wrap;gap:6px 0;list-style:none;margin:0;padding:0;counter-reset:f}
.flow li{flex:1 1 140px;min-width:0;display:grid;grid-template-rows:auto 1fr;gap:6px;position:relative;padding-right:18px}
.flow li::after{content:"";position:absolute;right:4px;top:13px;width:8px;height:8px;border-top:2px solid var(--border);border-right:2px solid var(--border);transform:rotate(45deg)}
.flow li:last-child::after{display:none}
.flow .node{display:flex;align-items:center;gap:8px}
.flow .dot{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:.78rem;border:2px solid var(--border);color:var(--muted-foreground);background:var(--card)}
.flow .done .dot{background:var(--ok);border-color:var(--ok);color:var(--primary-foreground)}
.flow .doing .dot{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.flow .warn .dot{border-color:var(--warn);color:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.flow .lab{font-size:.88rem;font-weight:600;line-height:1.35}
.flow .done .lab{color:var(--muted-foreground);font-weight:400}
.flow small{display:block;font-size:.78rem;color:var(--muted-foreground);line-height:1.4}
@media (max-width:560px){.flow{flex-direction:column;gap:10px}.flow li{flex:none;padding-right:0}.flow li::after{right:auto;left:13px;top:34px;transform:rotate(135deg)}.flow li:not(:last-child){padding-bottom:10px}}
.bar{height:6px;border-radius:3px;background:var(--muted);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok)}

/* ④ 成果と証拠 */
.ev{display:grid;gap:6px}
.ev .row{display:grid;grid-template-columns:5.5em 1fr;gap:12px;padding:9px 12px}
.ev .row>div{min-width:0}
.kind{font-family:var(--mono);font-size:.72rem;color:var(--muted-foreground);padding-top:3px}
.ev small{display:block;color:var(--muted-foreground);font-size:.84rem}

/* ⑤ blocks */
.blocks{display:grid;gap:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{padding:12px 14px;border-top:3px solid var(--tl,var(--border))}
.stat .v{font-family:var(--mono);font-size:1.7rem;line-height:1.1;color:var(--tc,var(--foreground));font-variant-numeric:tabular-nums}
.stat .v small{font-size:.8rem;margin-left:3px;color:var(--muted-foreground)}
.stat .l{font-size:.82rem;margin-top:4px}
.stat .n{font-size:.76rem;color:var(--muted-foreground)}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.cmp{padding:12px 14px;display:grid;gap:8px;align-content:start}
.cmp.first{border-color:var(--primary-line);box-shadow:inset 0 3px 0 var(--primary)}
.cmp ul{margin:0;padding-left:1.1em;font-size:.86rem;display:grid;gap:2px}
.meter .track{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--muted)}
.meter .track span{display:block;height:100%;background:var(--tc,var(--chart-1))}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:.8rem;color:var(--muted-foreground)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--tc,var(--chart-1))}
.callout{padding:10px 14px;border-radius:var(--radius);background:var(--ts);color:var(--foreground);border:1px solid var(--tl);font-size:.92rem}
.textblock{max-width:65ch;font-size:.92rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:.7rem;letter-spacing:.08em;color:var(--muted-foreground);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.plot{padding:12px;overflow-x:auto}
.plot svg{max-width:100%;height:auto}
.plot .n{font-size:.78rem;color:var(--muted-foreground);margin-top:6px}

/* ⑥ 経緯 */
details{border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}
summary{cursor:pointer;padding:10px 14px;font-size:.78rem;letter-spacing:.08em;color:var(--muted-foreground);font-weight:600}
.log{list-style:none;margin:0;padding:0 14px 12px;display:grid;gap:4px;font-size:.88rem}
.log li{display:grid;grid-template-columns:auto 1fr;gap:12px}
.log .at{font-family:var(--mono);font-size:.78rem;color:var(--muted-foreground);white-space:nowrap;padding-top:2px}
.status{font-size:.78rem;color:var(--muted-foreground)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main>
  <header class="head">
    <div class="toprow"><span class="chip t-muted" id="state">読み込み中</span><span class="muted mono" id="updated"></span><a id="hub" hidden>票の一覧</a></div>
    <h1 id="title">セッション票</h1>
    <p class="summary" id="summary"></p>
    <dl class="brief"><div><dt>依頼</dt><dd id="ask">—</dd></div><div><dt>完了条件</dt><dd id="done">—</dd></div></dl>
  </header>

  <section><h2>依頼者 にしてほしいこと <span class="count" id="askcount"></span></h2><div class="asks" id="asks"><p class="empty">読み込み中。</p></div></section>

  <section><h2>進捗 <span class="count" id="prog"></span></h2>
    <div class="bar" style="margin-bottom:14px"><span id="barfill" style="width:0%"></span></div>
    <ol class="flow" id="steps"></ol></section>

  <section><h2>成果と証拠</h2><div class="ev" id="evidence"><p class="empty">PR・Issue・調べた結果が出るたびにここへ並ぶ。</p></div></section>

  <section><div class="blocks" id="blocks"></div></section>

  <section><details><summary>経緯</summary><ul class="log" id="log"><li class="muted">まだ記録はない。</li></ul></details><p class="status" id="status"></p></section>
</main>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const STATE={running:["走行中","t-info"],waiting:["判断待ち","t-warn"],done:["完了","t-ok"],stopped:["中断","t-muted"]};
  const TONES=["info","warn","ok","danger","muted"];
  const tone=t=>"t-"+(TONES.includes(t)?t:"info");
  const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=String(text);return e};
  const fmt=s=>{const d=new Date(s);return isNaN(d)?String(s||""):d.toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})};
  const sorted=docs=>docs.map(d=>({id:d.id,v:d.data()||{}})).sort((a,b)=>(a.v.order||0)-(b.v.order||0));
  const safeUrl=u=>/^https:\/\//.test(String(u||""))?u:null;
  let asksCol=null; const busy=new Set();

  function meta(m){
    if(!m) return;
    const s=STATE[m.state]||STATE.running;
    $("state").textContent=s[0]; $("state").className="chip "+s[1];
    if(m.title){$("title").textContent=m.title}
    $("summary").textContent=m.summary||"";
    $("ask").textContent=m.ask||"—"; $("done").textContent=m.done||"—";
    $("updated").textContent=m.updatedAt?"最終更新 "+fmt(m.updatedAt):"";
    const h=safeUrl(m.hub); if(h){$("hub").href=h;$("hub").hidden=false}
  }
  function asks(docs){
    const box=$("asks"); box.replaceChildren(); const list=sorted(docs);
    const open=list.filter(x=>!x.v.answer).length;
    $("askcount").textContent=list.length?(open?open+" 件待ち":"すべて回答済み"):"";
    if(!list.length){box.appendChild(el("p","empty","依頼なし。今は 依頼者 の手を借りずに進められる。"));return}
    list.forEach(({id,v})=>{
      const card=el("div","card ask"+(v.answer?" done":""));
      card.appendChild(el("div","q",v.q));
      if(v.why) card.appendChild(el("div","why",v.why));
      const opts=el("div","opts");
      (v.options||[]).forEach((o,i)=>{
        const b=el("button","opt"); b.type="button"; b.id="opt-"+id+"-"+o.id; b.setAttribute("aria-pressed",String(v.answer===o.id));
        if(i===0) b.appendChild(el("span","rec","推奨"));
        b.appendChild(el("b",null,o.label)); if(o.desc) b.appendChild(el("small",null,o.desc));
        b.addEventListener("click",()=>save(id,{answer:o.id,answeredAt:new Date().toISOString()},card));
        opts.appendChild(b);
      });
      card.appendChild(opts);
      if(v.default) card.appendChild(el("div","why","答えなかった場合: "+v.default));
      const memo=el("textarea","memo"); memo.id="memo-"+id; memo.rows=1; memo.placeholder="補足（任意）"; memo.value=v.memo||"";
      memo.addEventListener("change",()=>save(id,{memo:memo.value},card)); card.appendChild(memo);
      card.appendChild(el("div","saved",v.answer?"回答済み · "+fmt(v.answeredAt):"未回答"));
      box.appendChild(card);
    });
  }
  async function save(id,patch,card){
    if(!asksCol||busy.has(id)) return; busy.add(id);
    const sv=card.querySelector(".saved"); if(sv) sv.textContent="保存中…";
    try{await asksCol.doc(id).update(patch)}catch(e){if(sv) sv.textContent="保存できなかった。claude.ai にサインインして開き直してほしい。"}
    busy.delete(id);
  }
  function flowList(ol,items,numbered){
    ol.replaceChildren();
    items.forEach((s,i)=>{
      const st=s.state||s.status||"todo"; const li=el("li",st);
      const node=el("div","node"); node.appendChild(el("span","dot",st==="done"?"✓":String(i+1)));
      node.appendChild(el("span","lab",s.label||s.title)); li.appendChild(node);
      if(s.note) li.appendChild(el("small",null,s.note)); ol.appendChild(li);
    });
  }
  function steps(docs){
    const list=sorted(docs).map(x=>x.v);
    if(!list.length){$("steps").replaceChildren(el("li","empty","ステップはまだない。"));$("prog").textContent="";return}
    const done=list.filter(s=>s.status==="done").length;
    $("prog").textContent=done+" / "+list.length;
    $("barfill").style.width=Math.round(done/list.length*100)+"%";
    flowList($("steps"),list);
  }
  function evidence(docs){
    const box=$("evidence"); const list=sorted(docs); if(!list.length) return; box.replaceChildren();
    list.forEach(({v})=>{
      const row=el("div","card row"); row.appendChild(el("span","kind",v.kind||""));
      const b=el("div"); b.appendChild(el("div",null,v.title)); if(v.detail) b.appendChild(el("small",null,v.detail));
      const u=safeUrl(v.link); if(u){const a=el("a",null,v.linkLabel||"開く"); a.href=u; b.appendChild(a)}
      row.appendChild(b); box.appendChild(row);
    });
  }
  let plotLoading=null;
  function loadPlot(){
    if(window.Plot) return Promise.resolve();
    if(plotLoading) return plotLoading;
    const add=src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)});
    plotLoading=add("https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js").then(()=>add("https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.17/dist/plot.umd.min.js"));
    return plotLoading;
  }
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function drawPlot(box,v){
    loadPlot().then(()=>{
      const marks={barY:Plot.barY,barX:Plot.barX,lineY:Plot.lineY,dot:Plot.dot}; const m=marks[v.mark]||Plot.barY;
      const opt={x:v.x,y:v.y,fill:v.mark==="lineY"?undefined:(v.color||css("--chart-1")),stroke:v.mark==="lineY"?(v.color||css("--chart-1")):undefined,tip:true};
      const fig=Plot.plot({width:Math.min(box.clientWidth||640,820),height:240,marginLeft:48,style:{background:"transparent",color:css("--muted-foreground"),fontFamily:css("--sans"),fontSize:"12px"},
        y:{grid:true},color:{range:[css("--chart-1"),css("--chart-2"),css("--chart-3"),css("--chart-4")]},
        marks:[m(v.data||[],opt),Plot.ruleY([0],{stroke:css("--border")})]});
      box.replaceChildren(fig); if(v.note) box.appendChild(el("div","n",v.note));
    }).catch(()=>{box.replaceChildren(el("p","empty","グラフを読み込めなかった。"))});
  }
  function blocks(docs){
    const root=$("blocks"); root.replaceChildren();
    sorted(docs).forEach(({v})=>{
      const sec=el("div"); if(v.title) sec.appendChild(el("h3",null,v.title));
      if(v.type==="flow"){const ol=el("ol","flow card");ol.style.padding="14px";flowList(ol,v.steps||[]);sec.appendChild(ol)}
      else if(v.type==="stats"){const g=el("div","stats");(v.items||[]).slice(0,4).forEach(s=>{const c=el("div","card stat "+(s.tone?tone(s.tone):""));const val=el("div","v",s.value);if(s.unit)val.appendChild(el("small",null,s.unit));c.appendChild(val);c.appendChild(el("div","l",s.label));if(s.note)c.appendChild(el("div","n",s.note));g.appendChild(c)});sec.appendChild(g)}
      else if(v.type==="compare"){const g=el("div","compare");(v.items||[]).forEach((c,i)=>{const k=el("div","card cmp"+(i===0?" first":""));const hd=el("div");hd.appendChild(el("b",null,c.name));if(c.badge){hd.append(" ");hd.appendChild(el("span","chip "+tone(c.tone||(i===0?"info":"muted")),c.badge))}k.appendChild(hd);const ul=el("ul");(c.points||[]).forEach(p=>ul.appendChild(el("li",null,p)));k.appendChild(ul);g.appendChild(k)});sec.appendChild(g)}
      else if(v.type==="meter"){const w=el("div","card meter");w.style.padding="12px 14px";const tr=el("div","track"),lg=el("div","legend");const total=v.total||(v.parts||[]).reduce((s,p)=>s+(+p.value||0),0)||1;(v.parts||[]).forEach((p,i)=>{const t=p.tone?tone(p.tone):"";const sp=el("span",t);sp.style.width=((+p.value||0)/total*100).toFixed(2)+"%";if(!p.tone)sp.style.background="var(--chart-"+(i%4+1)+")";tr.appendChild(sp);const it=el("span");const ic=el("i",t);if(!p.tone)ic.style.background="var(--chart-"+(i%4+1)+")";it.appendChild(ic);it.append(p.label+" "+p.value+(v.unit||""));lg.appendChild(it)});w.appendChild(tr);w.appendChild(lg);sec.appendChild(w)}
      else if(v.type==="plot"){const b=el("div","card plot");b.appendChild(el("p","muted","グラフを読み込み中…"));sec.appendChild(b);requestAnimationFrame(()=>drawPlot(b,v))}
      else if(v.type==="table"){const w=el("div","card tbl");const t=el("table");const hr=el("tr");(v.columns||[]).forEach(c=>hr.appendChild(el("th",null,c)));const th=el("thead");th.appendChild(hr);t.appendChild(th);const tb=el("tbody");(v.rows||[]).forEach(r=>{const tr=el("tr");r.forEach(c=>tr.appendChild(el("td",null,c)));tb.appendChild(tr)});t.appendChild(tb);w.appendChild(t);sec.appendChild(w)}
      else if(v.type==="callout"){sec.appendChild(el("div","callout "+tone(v.tone),v.text))}
      else {sec.appendChild(el("p","textblock",v.body||v.text||""))}
      root.appendChild(sec);
    });
  }
  function log(docs){
    const ul=$("log"); if(!docs.length) return; ul.replaceChildren();
    docs.forEach(d=>{const v=d.data()||{};const li=el("li");li.appendChild(el("span","at",fmt(v.at)));li.appendChild(el("span",null,v.text));ul.appendChild(li)});
  }

  const timer=setTimeout(()=>{$("status").textContent="記録を読み込めなかった。claude.ai にサインインした状態で開くと出る。"},10000);
  const ok=()=>clearTimeout(timer);
  const fail=()=>{clearTimeout(timer);$("status").textContent="記録の読み込みに失敗した。開き直すともう一度読む。"};
  claude.use("db").then(db=>{
    if(!db){ok();$("status").textContent="この表示では記録を読めない。claude.ai にサインインした状態で開くと出る。";$("asks").replaceChildren(el("p","empty","表示できない。"));return}
    db.doc("meta/session").onSnapshot(s=>{ok();meta(s.data())},fail);
    asksCol=db.collection("asks"); asksCol.onSnapshot(q=>{ok();asks(q.docs)},fail);
    db.collection("steps").onSnapshot(q=>{ok();steps(q.docs)},fail);
    db.collection("evidence").onSnapshot(q=>{ok();evidence(q.docs)},fail);
    db.collection("blocks").onSnapshot(q=>{ok();blocks(q.docs)},fail);
    db.collection("log").orderBy("at","desc").limit(100).onSnapshot(q=>{ok();log(q.docs)},fail);
  });
})();
</script>
